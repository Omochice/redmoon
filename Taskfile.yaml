version: "3"

vars:
  REDMINE_URL: http://localhost:3000
  API_KEY_FILE: _build/redmine-api-key
  COVERAGE_REPORT: _build/coverage/cobertura.xml
  KEYRING_COVERAGE_REPORT: _build/coverage/keyring.xml

tasks:
  registry:
    desc: Fetch the mooncakes registry index unless this machine already has it
    status:
      - test -d "${MOON_HOME:-$HOME/.moon}/registry/index"
    cmds:
      - moon update

  check:
    desc: Type-check every package, the integration tests included, and fail on warnings
    deps: [registry]
    cmds:
      - moon check --deny-warn
      - task: check:integration-test

  check:integration-test:
    desc: Type-check the integration-test module, which the root workspace leaves out, and fail on warnings
    deps: [registry]
    dir: integration-test
    cmds:
      - moon check --deny-warn

  test:
    desc: "Run the unit tests; arguments after `--` go to `moon test`"
    deps: [registry]
    cmds:
      - moon test {{.CLI_ARGS}}

  test:keyring:
    desc: "Run the keyring tests including the round trip through the OS credential store; arguments after `--` go to `moon test`"
    deps: [registry]
    cmds:
      - REDMOON_TEST_KEYRING=1 moon test {{if .COVERAGE}}--enable-coverage {{end}}-p omochice/keyring {{.CLI_ARGS}}

  test:keyring:coverage:
    desc: Run the keyring tests including the store round trip with coverage and write {{.KEYRING_COVERAGE_REPORT}}
    cmds:
      - moon coverage clean
      - task: test:keyring
        vars:
          COVERAGE: "true"
      - task: coverage:report
        vars:
          PACKAGE: omochice/keyring
          REPORT: "{{.KEYRING_COVERAGE_REPORT}}"

  test:coverage:
    desc: "Run the unit tests with coverage and write {{.COVERAGE_REPORT}}; arguments after `--` go to `moon test`"
    deps: [registry]
    cmds:
      - moon coverage clean
      - moon test --enable-coverage {{.CLI_ARGS}}
      - task: coverage:report

  coverage:report:
    desc: Write a cobertura report, {{.COVERAGE_REPORT}} unless REPORT is given, from the coverage data the last instrumented test run left, limited to PACKAGE when given
    vars:
      REPORT: "{{.REPORT | default .COVERAGE_REPORT}}"
    cmds:
      - mkdir -p {{dir .REPORT}}
      - moon coverage report -f cobertura {{if .PACKAGE}}-p {{.PACKAGE}} {{end}}-o {{.REPORT}}

  fmt:
    desc: Format MoonBit sources only; `nix fmt` also formats the non-MoonBit files and is the CI gate
    cmds:
      - moon fmt

  build:
    desc: Build the release executable for the native backend
    deps: [registry]
    cmds:
      - moon build --target native --release redmoon/src/cmd/redmoon

  build-info:stamp:
    desc: Overwrite the build-info source with this checkout's commit
    cmds:
      - bash .github/scripts/build-info.sh stamp

  build-info:verify:
    desc: Fail unless the build-info source is committed in its None form
    cmds:
      - bash .github/scripts/build-info.sh verify

  redmine:up:
    desc: Start the throwaway Redmine and wait until /login answers
    cmds:
      - docker compose up -d
      - |
        for _ in $(seq 1 120); do
          if curl -sf -o /dev/null {{.REDMINE_URL}}/login; then
            exit 0
          fi
          if [ -n "$(docker compose ps --status exited -q)" ]; then
            break
          fi
          sleep 5
        done
        echo "Redmine never answered on {{.REDMINE_URL}}" >&2
        docker compose logs
        exit 1

  redmine:seed:
    desc: Enable the REST API, load the default data, create project demo with issue templates and a saved query, and project demo-custom-fields with custom fields, and save the admin API key
    silent: true
    cmds:
      - |
        key=$(docker compose exec -T redmine sh -c \
          'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner \
           "Setting.rest_api_enabled = %q(1); puts User.find_by_login(%q(admin)).api_key"' \
          | tail -n 1)
        if [ -z "$key" ]; then
          echo "rails runner produced no API key" >&2
          docker compose logs redmine
          exit 1
        fi
        mkdir -p _build
        printf '%s' "$key" > {{.API_KEY_FILE}}
      - |
        if ! docker compose exec -T redmine sh -c \
          'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner "exit(Tracker.any? ? 0 : 1)"'; then
          docker compose exec -T redmine sh -c \
            'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" REDMINE_LANG=en bundle exec rake redmine:load_default_data'
        fi
      - |
        key=$(cat {{.API_KEY_FILE}})
        status=$(curl -sS -o /dev/null -w '%{http_code}' \
          -H "X-Redmine-API-Key: $key" {{.REDMINE_URL}}/projects/demo.json)
        if [ "$status" != 200 ]; then
          curl -sS --fail-with-body -o /dev/null -X POST \
            -H "X-Redmine-API-Key: $key" \
            -H "Content-Type: application/json" \
            -d '{"project":{"name":"Demo","identifier":"demo"}}' \
            {{.REDMINE_URL}}/projects.json
        fi
      - docker compose cp docker/redmine/seed-issue-templates.rb redmine:/tmp/seed-issue-templates.rb
      - |
        docker compose exec -T redmine sh -c \
          'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner /tmp/seed-issue-templates.rb'
      - docker compose cp docker/redmine/seed-custom-fields.rb redmine:/tmp/seed-custom-fields.rb
      - |
        docker compose exec -T redmine sh -c \
          'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner /tmp/seed-custom-fields.rb'
      - docker compose cp docker/redmine/seed-queries.rb redmine:/tmp/seed-queries.rb
      - |
        docker compose exec -T redmine sh -c \
          'SECRET_KEY_BASE="$REDMINE_SECRET_KEY_BASE" bundle exec rails runner /tmp/seed-queries.rb'

  redmine:down:
    desc: Stop the throwaway Redmine and keep its data volumes
    cmds:
      - docker compose down

  test:integration:
    desc: "Run the unit tests and the integration-test module against the seeded Redmine; arguments after `--` go to `moon test`"
    deps: [registry]
    dir: integration-test
    preconditions:
      - sh: test -s {{.ROOT_DIR}}/{{.API_KEY_FILE}}
        msg: "{{.API_KEY_FILE}} is missing; run `task redmine:seed` first"
    cmds:
      - REDMOON_TEST_ENDPOINT={{.REDMINE_URL}} REDMOON_TEST_API_KEY="$(cat {{.ROOT_DIR}}/{{.API_KEY_FILE}})" moon test {{if .COVERAGE}}--enable-coverage {{end}}{{.CLI_ARGS}}

  test:integration:coverage:
    desc: Run the unit tests and the integration-test module against the seeded Redmine with coverage and write {{.COVERAGE_REPORT}}
    cmds:
      - moon coverage clean
      # The root clean leaves integration-test/_build alone, where the instrumented run writes its data.
      - cd integration-test && moon coverage clean
      - task: test:integration
        vars:
          COVERAGE: "true"
      - task: coverage:report
