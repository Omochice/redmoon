name: nix-diff

on:
  pull_request:
    paths:
      - flake.lock
      - flake.nix

permissions: {}

concurrency:
  group: nix-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: natsukium/nix-diff-action@98f606826342376a063160500a3ebf8664d933e9 # v1.2.1
        with:
          attributes: |
            - displayName: dev shell
              attribute: devShells.x86_64-linux.default
          comment-strategy: update
