name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check

      - name: Verify the build-info source is committed in its None form
        run: nix develop --command task build-info:verify

      - run: nix develop --command task check

      - run: nix develop --command task test

  toolchain:
    permissions:
      contents: read
    uses: $/.github/workflows/toolchain.yaml

  test-native:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            toolchain: nix
          - runner: ubuntu-24.04-arm
            toolchain: installer
          - runner: windows-latest
            toolchain: installer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      MOONBIT_INSTALL_VERSION: ${{ needs.toolchain.outputs.version }}
    steps:
      - name: Disable auto CRLF
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        if: matrix.toolchain == 'nix'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        if: matrix.toolchain == 'installer'
        with:
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install MoonBit (Unix installer)
        if: matrix.toolchain == 'installer' && runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows installer)
        if: matrix.toolchain == 'installer' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Print the toolchain version
        run: ${{ matrix.toolchain == 'nix' && 'nix develop --command ' || '' }}moon version --all

      - run: ${{ matrix.toolchain == 'nix' && 'nix develop --command ' || '' }}task test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Redmine and wait for it to answer
        run: nix develop --command task redmine:up

      - name: Enable the REST API and seed the project under test
        run: nix develop --command task redmine:seed

      - name: Mask the admin API key
        run: echo "::add-mask::$(cat _build/redmine-api-key)"

      - name: Run the integration tests with coverage
        run: nix develop --command task test:integration:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: _build/coverage/cobertura.xml

      - name: Dump the Redmine logs
        if: failure()
        run: docker compose logs

  report:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: _build/coverage

      - name: Expose Nix-provided octocov on PATH
        run: |
          nix develop --command bash <<'EOF' >> "$GITHUB_PATH"
          set -euo pipefail
          octocov_path="$(command -v octocov)"
          dirname "$octocov_path"
          EOF

      - name: Report coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: octocov.yaml
          check-existence: true

  build:
    needs: toolchain
    permissions:
      contents: read
    uses: $/.github/workflows/build.yaml
    with:
      version: ${{ needs.toolchain.outputs.version }}

  status-check:
    timeout-minutes: 5
    name: Status Check
    runs-on: ubuntu-latest
    needs:
      # keep-sorted start
      - build
      - check
      - integration
      - report
      - test-native
      # keep-sorted end
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
