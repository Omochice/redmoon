name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check

      - name: Verify the build-info source is committed in its None form
        run: nix develop --command task build-info:verify

      - run: nix develop --command task check

      - run: nix develop --command task test

  test-macos:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix develop --command task test

      - run: nix develop --command task test:keyring:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-keyring
          path: _build/coverage/keyring.xml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Redmine and wait for it to answer
        run: nix develop --command task redmine:up

      - name: Enable the REST API and seed the project under test
        run: nix develop --command task redmine:seed

      - name: Mask the admin API key
        run: echo "::add-mask::$(cat _build/redmine-api-key)"

      - name: Run the integration tests with coverage
        run: nix develop --command task test:integration:coverage

      - name: Drop files without instrumented lines from the report
        run: sed -i -z -E 's/ *<class [^>]*line-rate="-?nan">\s*<lines>\s*<\/lines>\s*<\/class>\n//g' _build/coverage/cobertura.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: _build/coverage/cobertura.xml

      - name: Dump the Redmine logs
        if: failure()
        run: docker compose logs

  report:
    needs: [integration, test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage*
          path: _build/coverage
          merge-multiple: true

      - name: Expose Nix-provided octocov on PATH
        run: |
          nix develop --command bash <<'EOF' >> "$GITHUB_PATH"
          set -euo pipefail
          octocov_path="$(command -v octocov)"
          dirname "$octocov_path"
          EOF

      - name: Report coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: octocov.yaml
          check-existence: true

  build:
    permissions:
      contents: read
    uses: $/.github/workflows/build.yaml

  # nix flake check only evaluates packages, so the Nix package is built and run here.
  nix-package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#redmoon
      - run: ./result/bin/redmoon --help

  status-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      # keep-sorted start
      - build
      - check
      - integration
      - nix-package
      - report
      - test-macos
      # keep-sorted end
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
