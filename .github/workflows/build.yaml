name: build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp the build information
        run: nix develop --command task build-info:stamp

      - name: Build the executable
        run: nix develop --command task build

      - name: Stage the executable under the asset name
        run: |
          mkdir -p dist
          cp _build/native/release/build/omochice/redmoon/cmd/redmoon/redmoon.exe \
            "dist/redmoon-${{ matrix.target }}"

      - name: Smoke-run the artifact
        run: ./dist/redmoon-${{ matrix.target }} --help

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redmoon-${{ matrix.target }}
          path: dist/redmoon-${{ matrix.target }}
          if-no-files-found: error
