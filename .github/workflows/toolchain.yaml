name: toolchain

# The runners without nix install MoonBit with the official installer, which
# takes a version name. Reading it from the nix devShell keeps flake.lock the
# only place the compiler version is pinned, so renovate bumping the lock moves
# every runner together.
on:
  workflow_call:
    outputs:
      version:
        description: The MoonBit release name the installer accepts
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.moonc.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `moonc -v` prints `v0.10.15+943464bfa (date)`; the installer's download
      # path is the same string without the leading `v`.
      - name: Read the compiler version
        id: moonc
        run: |
          version=$(nix develop --command moonc -v | perl -ne 'if (/^v(\d\S*)/) { print $1; exit }')
          if [ -z "$version" ]; then
            echo "could not read the moonc version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
