name: toolchain

on:
  workflow_call:
    outputs:
      version:
        description: The MoonBit release name the installer accepts
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.moonc.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the compiler version
        id: moonc
        run: |
          version=$(nix develop --command moonc -v | perl -ne 'if (/^v(\d\S*)/) { print $1; exit }')
          if [ -z "$version" ]; then
            echo "could not read the moonc version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
